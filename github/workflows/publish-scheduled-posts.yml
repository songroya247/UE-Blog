name: Publish Scheduled Posts

# Runs once a day. Cloudflare Pages/Workers Builds is already watching pushes
# to `main`, so committing a post here automatically triggers a live deploy —
# no separate Cloudflare-side scheduling needed.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 WAT. Adjust the hour if you want a different publish time.
  workflow_dispatch: {}    # lets you trigger it manually from the GitHub Actions tab too, for testing

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move today's due posts from the queue into the live posts folder
        run: python3 .github/scripts/publish_scheduled.py

      - name: Commit and push if anything was published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet --cached || git commit -m "Auto-publish scheduled posts for $(date -u +%F)"
          git push
