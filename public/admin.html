<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Comment Moderation — Ultimate Edge Blog</title>
<style>
  :root{
    --ink:#1f2420;
    --paper:#faf6ee;
    --paper-raised:#ffffff;
    --forest:#0b3d2e;
    --forest-dim:#12513d;
    --gold:#c9922e;
    --gold-soft:#f3e3c2;
    --rust:#a8452c;
    --rust-soft:#f7e2da;
    --line:#e4ded0;
    --muted:#6b6459;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Source Sans 3', -apple-system, sans-serif; line-height:1.5;
    padding:20px 16px 60px;
  }
  h1{
    font-family:'Fraunces', Georgia, serif; color:var(--forest); font-size:1.6rem; margin:0 0 6px;
  }
  .sub{color:var(--muted); font-size:.9rem; margin:0 0 24px;}

  .token-box{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px;
    padding:18px; margin-bottom:24px; display:flex; flex-direction:column; gap:10px;
  }
  .token-box label{font-weight:600; font-size:.9rem; color:var(--forest);}
  .token-box input{
    font-size:1rem; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px;
    background:var(--paper);
  }
  .token-box input:focus{outline:none; border-color:var(--gold);}
  .token-row{display:flex; gap:10px; flex-wrap:wrap;}
  button{
    font-family:inherit; font-weight:600; font-size:.9rem; cursor:pointer;
    border:none; border-radius:999px; padding:10px 20px; transition:background .15s ease;
  }
  .btn-primary{background:var(--forest); color:#fbf7ec;}
  .btn-primary:hover{background:var(--forest-dim);}
  .btn-danger{background:var(--rust-soft); color:var(--rust); border:1.5px solid var(--rust);}
  .btn-danger:hover{background:var(--rust); color:#fff;}
  .btn-secondary{background:var(--paper); color:var(--forest-dim); border:1.5px solid var(--line);}

  #status{font-size:.85rem; margin-top:4px; min-height:1.2em;}
  #status.error{color:var(--rust);}
  #status.success{color:var(--forest-dim);}

  #commentsList{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px;}
  .comment-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:16px;
  }
  .comment-meta{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
  .comment-name{font-family:'Fraunces', Georgia, serif; font-weight:600; color:var(--forest);}
  .comment-slug{
    font-size:.72rem; color:var(--gold); background:var(--gold-soft);
    padding:2px 8px; border-radius:999px; font-weight:600;
  }
  .comment-date{font-size:.75rem; color:var(--muted);}
  .comment-body{font-size:.92rem; color:var(--ink); white-space:pre-wrap; margin-bottom:12px;}
  .empty-state{color:var(--muted); font-size:.9rem; text-align:center; padding:40px 0;}
</style>
</head>
<body>

<h1>Comment Moderation</h1>
<p class="sub">Not linked from the site, not indexed by search engines — access requires your admin token.</p>
<p class="sub" style="margin-top:-14px;"><a href="/content-dashboard.html" style="color:var(--forest-dim); font-weight:600;">&rarr; Go to Content Dashboard</a></p>

<div class="token-box">
  <label for="tokenInput">Admin Token</label>
  <input type="password" id="tokenInput" placeholder="Enter your ADMIN_TOKEN" autocomplete="off" />
  <div class="token-row">
    <button class="btn-primary" id="loadBtn">Load Comments</button>
    <button class="btn-secondary" id="forgetBtn">Forget Token</button>
  </div>
  <p id="status"></p>
</div>

<ul id="commentsList"></ul>
<div id="loadMoreWrap" style="text-align:center; margin-top:20px; display:none;">
  <button class="btn-secondary" id="loadMoreBtn">Load More</button>
</div>

<script>
  const API_BASE = "/api";
  const PAGE_SIZE = 20;
  const tokenInput = document.getElementById('tokenInput');
  const loadBtn = document.getElementById('loadBtn');
  const forgetBtn = document.getElementById('forgetBtn');
  const statusEl = document.getElementById('status');
  const commentsList = document.getElementById('commentsList');
  const loadMoreWrap = document.getElementById('loadMoreWrap');
  const loadMoreBtn = document.getElementById('loadMoreBtn');

  let currentOffset = 0;
  let currentTotal = 0;

  // Remember the token in THIS browser only, so you don't retype it every visit.
  const saved = localStorage.getItem('admin_token');
  if (saved) tokenInput.value = saved;

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = kind || '';
  }

  function appendComments(comments) {
    comments.forEach((c) => {
      const li = document.createElement('li');
      li.className = 'comment-card';
      const date = new Date(c.created_at + 'Z');
      const dateStr = isNaN(date.getTime()) ? '' : date.toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      li.innerHTML = `
        <div class="comment-meta">
          <span><span class="comment-name"></span> — <span class="comment-slug"></span></span>
          <span class="comment-date">${dateStr}</span>
        </div>
        <p class="comment-body"></p>
        <button class="btn-danger" data-id="${c.id}">Delete</button>
      `;
      li.querySelector('.comment-name').textContent = c.name;
      li.querySelector('.comment-slug').textContent = c.post_slug;
      li.querySelector('.comment-body').textContent = c.comment;
      li.querySelector('.btn-danger').addEventListener('click', () => deleteComment(c.id, li));
      commentsList.appendChild(li);
    });
  }

  function updateLoadMoreVisibility(hasMore) {
    loadMoreWrap.style.display = hasMore ? 'block' : 'none';
  }

  async function fetchPage(offset) {
    const token = tokenInput.value.trim();
    const res = await fetch(`${API_BASE}/moderate/comments?token=${encodeURIComponent(token)}&offset=${offset}&limit=${PAGE_SIZE}`);
    if (res.status === 401) {
      throw new Error('unauthorized');
    }
    return res.json();
  }

  async function loadComments() {
    const token = tokenInput.value.trim();
    if (!token) {
      setStatus('Enter your admin token first.', 'error');
      return;
    }
    localStorage.setItem('admin_token', token);
    setStatus('Loading…');
    commentsList.innerHTML = '';
    currentOffset = 0;

    try {
      const data = await fetchPage(0);
      currentOffset = data.comments.length;
      currentTotal = data.total;
      if (!data.comments || data.comments.length === 0) {
        commentsList.innerHTML = '<li class="empty-state">No comments found.</li>';
        updateLoadMoreVisibility(false);
        setStatus(`0 of ${data.total} comments.`, 'success');
        return;
      }
      appendComments(data.comments);
      updateLoadMoreVisibility(data.hasMore);
      setStatus(`Showing ${currentOffset} of ${data.total} comments.`, 'success');
    } catch (e) {
      if (e.message === 'unauthorized') {
        setStatus('Incorrect token.', 'error');
      } else {
        setStatus('Network error — please try again.', 'error');
      }
    }
  }

  async function loadMore() {
    loadMoreBtn.disabled = true;
    try {
      const data = await fetchPage(currentOffset);
      appendComments(data.comments);
      currentOffset += data.comments.length;
      currentTotal = data.total;
      updateLoadMoreVisibility(data.hasMore);
      setStatus(`Showing ${currentOffset} of ${data.total} comments.`, 'success');
    } catch (e) {
      setStatus('Network error loading more — please try again.', 'error');
    }
    loadMoreBtn.disabled = false;
  }

  async function deleteComment(id, cardEl) {
    const token = tokenInput.value.trim();
    if (!confirm('Delete this comment permanently?')) return;
    try {
      const res = await fetch(`${API_BASE}/moderate/delete`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, token }),
      });
      const data = await res.json();
      if (data.ok) {
        cardEl.remove();
        currentOffset = Math.max(currentOffset - 1, 0);
        currentTotal = Math.max(currentTotal - 1, 0);
        setStatus(`Comment deleted. Showing ${currentOffset} of ${currentTotal} comments.`, 'success');
      } else {
        setStatus(data.error || 'Delete failed.', 'error');
      }
    } catch (e) {
      setStatus('Network error — please try again.', 'error');
    }
  }

  loadBtn.addEventListener('click', loadComments);
  loadMoreBtn.addEventListener('click', loadMore);
  forgetBtn.addEventListener('click', () => {
    localStorage.removeItem('admin_token');
    tokenInput.value = '';
    commentsList.innerHTML = '';
    updateLoadMoreVisibility(false);
    setStatus('Token forgotten from this browser.', 'success');
  });

  // Auto-load if a token is already remembered on this device
  if (saved) loadComments();
</script>

</body>
</html>
